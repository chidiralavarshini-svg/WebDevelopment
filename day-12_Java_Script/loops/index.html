<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let i=1;i<=10;i++){
            console.log(`the value ${i}`)
        }

        let cnt=1;
        while(cnt<=5){
            console.log("hello while loop")
            cnt++
        }
        
        let num=7;
        do{
            alert("hi i am a notification")
        }while(num<=5)
    </script>
</body>
