<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            text-align: center;
            background-color: aqua;
            height: 200px;
            width: 200px;
            border:1px solid black;
            border-radius: 10px;
            padding: 20px;
            margin: 20px;
            box-sizing: border-box;
        }
        p{
            border-bottom: 2px double red;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <p>Hello guys</p>
    </div>
    <div class="box">
        <p>Books</p>
    </div>
</body>
</html>
